server:
  port: 8005

spring:
  application:
    name: notifications
  profiles:
    active: "dev"
  # === Database Configuration ===
  datasource:
    url: jdbc:mysql://localhost:3306/notification_schema
    username: notifications_svc_user
    password: quan12345656915691
    driverClassName: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update # 'update' for dev, switch to 'validate' or 'none' later
    show-sql: true # Log SQL for dev
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost} # Use placeholder for RabbitMQ host
    port: 5672      # Default RabbitMQ port
    username: hoangquan
    password: quan5691
    listener:
      simple:
        missing-queues-fatal: false
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # === Redis Configuration ===
  data:
    redis:
      host: ${REDIS_HOST:localhost} # Use placeholder for Redis host
      port: 6379
      redisson:
        # Single node example
        single-server-config:
          address: "redis://127.0.0.1:6379"

# === Eureka Client Configuration ===
eureka:
  instance:
    preferIpAddress: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://${HOSTNAME}:8070/eureka/

# === Management & Actuator ===
management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# === Logging ===
logging:
  level:
    root: INFO
    org.springframework.web.reactive: DEBUG
    org.springframework.security: DEBUG
    reactor.netty.http.server: DEBUG
    com.example.liveauctions: DEBUG
  pattern:
    level: "%5p [${spring.application.name},%X{trace_id},%X{span_id}] %m%n"


# === Custom App Info ===
info:
  app:
    name: "Notification Service"
    description: "Handles real-time notifications"
    version: "1.0.0"


